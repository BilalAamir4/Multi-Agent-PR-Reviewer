# alembic: "Treat empty string comments as no comment in autogenerate"
# Two plants: a flipped comparison in the table comment comparator and a weakened render test.
item_id: item_006
repo: alembic
commit: 326e8fb37aa6bd85cfccad11919c3646e7677abe
expected_bucket: large
is_clean: false
bugs:
- bug_id: b1
  kind: wrong_comparison
  file: alembic/autogenerate/compare/comments.py
  find: |2
        if metadata_comment is None and conn_comment is not None:
  replace: |2
        if metadata_comment is None and conn_comment is None:
  description: >-
    _compare_table_comment tests conn_comment is None instead of is not None in the drop-comment branch,
    so that branch can never run and a table comment that was removed from the metadata is reported as
    a CreateTableCommentOp with a None comment instead of a DropTableCommentOp.
- bug_id: b2
  kind: ineffective_test
  file: tests/test_autogen_render.py
  find: |2
            eq_ignore_whitespace(
                autogenerate.render_op_text(self.autogen_context, op_obj),
                "op.add_column('foo', sa.Column('x', sa.Integer(), "
                "nullable=True, comment=''))",
            )
  replace: |2
            rendered = autogenerate.render_op_text(self.autogen_context, op_obj)
            assert rendered
  description: >-
    test_render_add_column_with_empty_comment only asserts that the rendered text is not empty, so it
    no longer checks that an empty string comment is emitted as comment='' in the add_column call.
