# sqlite-utils: ".transform() preserves check constraints, refs #762"
# Two plants: an unquoted constraint name in generated SQL and a loose bound in the identifier check.
item_id: item_010
repo: sqlite-utils
commit: 2303b80aef69abe418636dc980c5350958d55411
expected_bucket: medium
is_clean: false
bugs:
- bug_id: b1
  kind: sql_injection
  file: sqlite_utils/db.py
  find: |2
        prefix = f"CONSTRAINT {quote_identifier(check.name)} " if check.name else ""
  replace: |2
        prefix = f"CONSTRAINT {check.name} " if check.name else ""
  description: >-
    _check_constraint_sql formats the constraint name into the CREATE TABLE statement without quote_identifier,
    so a CHECK constraint name containing spaces, quotes or SQL syntax is interpreted as SQL instead of
    as one identifier when the table is recreated.
- bug_id: b2
  kind: off_by_one
  file: sqlite_utils/create_table_parser.py
  find: |2
        if index + 1 < len(tokens) and tokens[index + 1].text in ("(", "."):
  replace: |2
        if index + 1 <= len(tokens) and tokens[index + 1].text in ("(", "."):
  description: >-
    _is_identifier_token bounds the look-ahead with <= instead of <, so for the last token of a CHECK
    expression tokens[index + 1] raises IndexError when a column is renamed or dropped.
