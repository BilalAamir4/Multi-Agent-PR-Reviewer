[project]
name = "multi-agent-pr-reviewer"
version = "0.1.0"
description = "Multi-agent LangChain/LangGraph reviewer for Python pull requests, with an evaluation against a single agent."
readme = "README.md"
authors = [
    { name = "Bilal Aamir", email = "bilalaamirr@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "bandit==1.9.4",
    "docker==7.2.0",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "langchain==1.5.1",
    "langchain-google-genai==4.5.0",
    "langchain-groq==1.2.1",
    "langgraph==1.2.22",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langsmith==0.15.0",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "ruff==0.17.5",
    "unidiff==1.0.1",
    "uvicorn==0.54.0",
]

[project.scripts]
reviewer = "reviewer.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "reviewer"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]==0.4.43",
    "pytest==9.2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# The dev fixture is data with fixed line numbers; formatting it would move them.
extend-exclude = ["tests/fixtures/dev_pr"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "integration: needs network, API keys or Docker",
]